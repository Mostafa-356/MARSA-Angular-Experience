kind = "web"
previewPath = "/"
title = "MARSA — Saudi Marine Hospitality"
description = "A premium bilingual Saudi Red Sea marine hospitality and yacht provisioning experience for owners, captains, crew, and VIP travelers."
version = "1.0.0"
id = "artifacts/marsa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23995

[services.development]
run = "pnpm --filter @workspace/marsa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marsa", "run", "build" ]
serve = "static"
publicDir = "artifacts/marsa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23995"
BASE_PATH = "/"
